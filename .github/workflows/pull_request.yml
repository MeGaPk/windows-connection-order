name: windows-exe-ci

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/**"
      - "**/*.swift"
      - ".github/scripts/windows/build-windows-executables.ps1"
      - "Tests/**"
      - "Package.swift"
      - "Package.resolved"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  swift-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      SWIFT_VERSION: "6.3.3"

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Swift (Linux)
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: ${{ env.SWIFT_VERSION }}

      - name: Restore build cache
        uses: actions/cache@v4
        with:
          path: |
            .build
            /tmp/swiftpm
            ~/.swiftpm
          key: ${{ runner.os }}-swift-${{ env.SWIFT_VERSION }}-${{ hashFiles('Package.swift', 'Package.resolved') }}-test
          restore-keys: |
            ${{ runner.os }}-swift-${{ env.SWIFT_VERSION }}-
            ${{ runner.os }}-swift-

      - name: Run tests
        run: |
          swift test
