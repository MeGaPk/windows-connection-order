name: windows-exe-release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: windows-latest
    timeout-minutes: 90
    permissions:
      contents: write
    env:
      SWIFT_VERSION: "6.3"
      ARTIFACTS_DIR: "artifacts"

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Swift
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: ${{ env.SWIFT_VERSION }}

      - name: Restore/build cache
        uses: actions/cache@v4
        with:
          path: |
            .build
            ${{ env.LOCALAPPDATA }}\swiftpm\cache
            ${{ env.LOCALAPPDATA }}\swiftpm\repositories
          key: ${{ runner.os }}-swift-${{ env.SWIFT_VERSION }}-${{ hashFiles('Package.swift', 'Package.resolved') }}-release
          restore-keys: |
            ${{ runner.os }}-swift-${{ env.SWIFT_VERSION }}-
            ${{ runner.os }}-swift-

      - name: Build GUI and CLI apps
        shell: pwsh
        run: |
          pwsh .github/scripts/windows/build-windows-executables.ps1 `
            -Workspace $env:GITHUB_WORKSPACE `
            -ArtifactsDir $env:ARTIFACTS_DIR `
            -Configuration release `
            -Products @("WindowsConnectionOrder", "WindowsConnectionOrderCLI")

      - name: Prepare release archive
        id: prepare_release
        shell: pwsh
        run: |
          $zipPath = Join-Path $env:GITHUB_WORKSPACE "WindowsConnectionOrder-windows.zip"
          pwsh .github/scripts/windows/create-windows-release-package.ps1 `
            -Workspace $env:GITHUB_WORKSPACE `
            -ArtifactsDir $env:ARTIFACTS_DIR `
            -ZipPath $zipPath
          Write-Output "archive_path=$zipPath" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.prepare_release.outputs.archive_path }}
          generate_release_notes: true
