name: windows-exe-ci

on:
  push:
    branches:
      - main
    paths:
      - "**/*.swift"
      - ".github/workflows/windows-exe-ci.yml"
      - ".github/scripts/windows/build-windows-executables.ps1"
      - "Package.swift"
      - "Package.resolved"
  pull_request:
    branches:
      - main
    paths:
      - "**/*.swift"
      - ".github/workflows/windows-exe-ci.yml"
      - ".github/scripts/windows/build-windows-executables.ps1"
      - "Package.swift"
      - "Package.resolved"
  workflow_dispatch:

jobs:
  build-windows-exe:
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      SWIFT_VERSION: "6.3"
      ARTIFACTS_DIR: "artifacts"

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Swift
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: ${{ env.SWIFT_VERSION }}

      - name: Restore/build cache
        uses: actions/cache@v4
        with:
          path: |
            .build
            ${{ env.LOCALAPPDATA }}\swiftpm\cache
            ${{ env.LOCALAPPDATA }}\swiftpm\repositories
          key: ${{ runner.os }}-swift-${{ env.SWIFT_VERSION }}-${{ hashFiles('Package.swift', 'Package.resolved') }}-build
          restore-keys: |
            ${{ runner.os }}-swift-${{ env.SWIFT_VERSION }}-
            ${{ runner.os }}-swift-

      - name: Build GUI and CLI apps
        shell: pwsh
        run: |
          pwsh .github/scripts/windows/build-windows-executables.ps1 `
            -Workspace $env:GITHUB_WORKSPACE `
            -ArtifactsDir $env:ARTIFACTS_DIR `
            -Configuration release `
            -Products @("WindowsConnectionOrder", "WindowsConnectionOrderCLI")

      - name: Upload Windows app and CLI executables
        uses: actions/upload-artifact@v4
        with:
          name: windows-executables
          path: artifacts/*.exe
          retention-days: 7
